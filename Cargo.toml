[workspace]
members = ["src-tauri"]

[package]
name = "mebal"
version = "0.1.0"
edition = "2024"
authors = ["Larson Software LLC <brody@fuck.it>"]
description = "A replay buffer for continuous video recording with instant replay"
license-file = "LICENSE"
repository = "https://github.com/yourusername/mebal"

[lints]
workspace = true

[dependencies]
ffmpeg-next = "7.0"
ffmpeg-sys-next = { version = "7.0", features = ["static"] }

# Global hotkey support (non-exclusive, uses low-level keyboard hook)
livesplit-hotkey = "0.7"

# For async runtime (needed by global-hotkey)
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"

# Configuration
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Time handling
chrono = "0.4"

# Cross-platform path handling
dirs = "5.0"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
windows = { version = "0.58", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_UI_HiDpi",
] }

# Command line arguments
clap = { version = "4.4", features = ["derive"] }

# Concurrent data structures
parking_lot = "0.12"

# Zero-copy byte buffers
bytes = "1"

# Wait-free read-mostly shared state
arc-swap = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "buffer"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Shared lints so style debt can't silently re-accumulate. Correctness/suspicious/
# perf are deny/warn by default and stay on. Deliberately NOT enabling
# clippy::unwrap_used (remaining unwraps are documented invariants) or the
# pedantic/nursery groups (noisy, churny across toolchain bumps).
[workspace.lints.clippy]
manual_is_multiple_of = "warn"
collapsible_if = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
